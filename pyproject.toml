[project]
name = "optionlab"
version = "0.1.0"
description = "Option pricing with Black-Scholes, a CRR binomial tree and Monte Carlo."
readme = "README.md"
authors = [{ name = "Emily Yu" }]
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.9",
    "jupyter>=1.1",
]
# Test-only pricing oracle. Never import QuantLib from src/.
oracle = [
    "QuantLib>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "NPY", # numpy-specific rules (e.g. legacy np.random calls)
    "PT",  # pytest style
    "RUF", # ruff-specific
]
# Finance notation (S, K, T) is clearer than pep8 lowercase in tests and notebooks.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# The notebook skeleton imports what the study will need before any cell uses it.
"notebooks/*.ipynb" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["optionlab"]
# Tests import shared tolerances and helpers from tests/conftest.py.
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
